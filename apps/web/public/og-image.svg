<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      @font-face {
        font-family: 'Bricolage Grotesque';
        font-weight: 800;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0F0F12"/>

  <!-- Heat border accent -->
  <rect x="0" y="0" width="8" height="630" fill="#FF5A1F"/>
  <rect x="1192" y="0" width="8" height="630" fill="#FF5A1F"/>

  <!-- Main title -->
  <text x="80" y="210" font-family="'Bricolage Grotesque', 'Arial Black', sans-serif" font-weight="800" font-size="130" fill="#F4EFE6" letter-spacing="-6">WHO'S</text>
  <text x="80" y="345" font-family="'Bricolage Grotesque', 'Arial Black', sans-serif" font-weight="800" font-size="130" fill="#C6FF3D" letter-spacing="-6">COOKED?</text>

  <!-- Tagline -->
  <text x="82" y="410" font-family="'Atkinson Hyperlegible', Arial, sans-serif" font-weight="700" font-size="28" fill="#A9A6B3">8 microgames. 3 lives. Daily challenge.</text>

  <!-- Sticker card -->
  <rect x="82" y="450" width="420" height="56" rx="10" fill="#1A1A20"/>
  <rect x="82" y="450" width="420" height="56" rx="10" stroke="#111114" stroke-width="2"/>
  <rect x="85" y="453" width="420" height="56" rx="10" fill="none" stroke="#FF5A1F" stroke-width="0" opacity="0"/>
  <!-- shadow offset -->
  <rect x="88" y="458" width="420" height="56" rx="10" fill="#FF5A1F" opacity="0.3"/>
  <rect x="82" y="450" width="420" height="56" rx="10" fill="#F4EFE6"/>
  <text x="102" y="487" font-family="'Bricolage Grotesque', 'Arial Black', sans-serif" font-weight="800" font-size="22" fill="#111114">Locked In → Fully Cooked</text>

  <!-- Mode pills -->
  <rect x="82" y="528" width="100" height="34" rx="8" fill="#FF5A1F"/>
  <text x="132" y="550" font-family="'Arial Black', sans-serif" font-weight="800" font-size="14" fill="#111114" text-anchor="middle">Blitz</text>

  <rect x="194" y="528" width="110" height="34" rx="8" fill="#FF3366"/>
  <text x="249" y="550" font-family="'Arial Black', sans-serif" font-weight="800" font-size="14" fill="#F4EFE6" text-anchor="middle">One Life</text>

  <rect x="316" y="528" width="100" height="34" rx="8" fill="#FFD23F"/>
  <text x="366" y="550" font-family="'Arial Black', sans-serif" font-weight="800" font-size="14" fill="#111114" text-anchor="middle">Daily</text>

  <rect x="428" y="528" width="100" height="34" rx="8" fill="#6BE4FF"/>
  <text x="478" y="550" font-family="'Arial Black', sans-serif" font-weight="800" font-size="14" fill="#111114" text-anchor="middle">Chill</text>

  <!-- Toast mascot (simple SVG) -->
  <g transform="translate(850, 80)">
    <!-- Toast body -->
    <rect x="20" y="40" width="200" height="250" rx="40" fill="#C87941"/>
    <rect x="20" y="40" width="200" height="250" rx="40" fill="none" stroke="#111114" stroke-width="4"/>
    <!-- Toast top bumps -->
    <ellipse cx="80" cy="52" rx="40" ry="30" fill="#C87941" stroke="#111114" stroke-width="4"/>
    <ellipse cx="160" cy="52" rx="40" ry="30" fill="#C87941" stroke="#111114" stroke-width="4"/>
    <!-- Eyes -->
    <circle cx="85" cy="135" r="22" fill="white" stroke="#111114" stroke-width="3"/>
    <circle cx="155" cy="135" r="22" fill="white" stroke="#111114" stroke-width="3"/>
    <circle cx="90" cy="135" r="12" fill="#111114"/>
    <circle cx="160" cy="135" r="12" fill="#111114"/>
    <!-- Sweat drop (stressed) -->
    <ellipse cx="175" cy="110" rx="6" ry="10" fill="#6BE4FF" stroke="#111114" stroke-width="2"/>
    <!-- Mouth (worried) -->
    <path d="M 90 185 Q 120 175 150 185" fill="none" stroke="#111114" stroke-width="4" stroke-linecap="round"/>
    <!-- Speech bubble -->
    <rect x="-120" y="-20" width="180" height="60" rx="12" fill="#F4EFE6" stroke="#111114" stroke-width="3"/>
    <rect x="-116" y="-17" width="180" height="60" rx="12" fill="none" stroke="#FF5A1F" stroke-width="0"/>
    <!-- bubble tail -->
    <polygon points="30,-10 50,0 30,10" fill="#F4EFE6" stroke="#111114" stroke-width="3"/>
    <text x="-90" y="10" font-family="'Arial Black', sans-serif" font-weight="800" font-size="16" fill="#111114">am i cooked?</text>
    <text x="-90" y="30" font-family="Arial, sans-serif" font-weight="700" font-size="13" fill="#FF5A1F">find out in 60s</text>
  </g>

  <!-- Score badge -->
  <g transform="translate(850, 400)">
    <rect x="0" y="0" width="200" height="100" rx="16" fill="#C6FF3D" stroke="#111114" stroke-width="3"/>
    <rect x="4" y="4" width="200" height="100" rx="16" fill="#C6FF3D" stroke="#FF5A1F" stroke-width="0" opacity="0"/>
    <!-- shadow -->
    <rect x="6" y="8" width="200" height="100" rx="16" fill="#FF5A1F" opacity="0.4"/>
    <rect x="0" y="0" width="200" height="100" rx="16" fill="#C6FF3D" stroke="#111114" stroke-width="3"/>
    <text x="100" y="58" font-family="'Bricolage Grotesque', 'Arial Black', sans-serif" font-weight="800" font-size="52" fill="#111114" text-anchor="middle">73</text>
    <text x="100" y="82" font-family="Arial, sans-serif" font-weight="700" font-size="14" fill="#111114" text-anchor="middle">LOCKED IN</text>
  </g>
</svg>
