name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @whoscooked/web exec playwright install --with-deps chromium
      - run: pnpm e2e
  # TODO(M0-owner): add preview + production deploy jobs once CLOUDFLARE_API_TOKEN,
  # CLOUDFLARE_ACCOUNT_ID and the Neon DATABASE_URL secrets exist in GitHub.
  # Migrations run here via `pnpm --filter @whoscooked/db db:migrate`, never at runtime.
